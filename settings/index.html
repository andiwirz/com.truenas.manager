<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrueNAS Manager</title>

  <script type="text/javascript">
    // Defined before homey.js loads, so the callback always exists when it
    // fires. The body script may not be parsed yet at that point, hence the
    // DOM-ready guard around everything that lives down there.
    var Homey;
    var readyFired = false;

    function whenReady(fn) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fn);
      } else {
        fn();
      }
    }

    function onHomeyReady(homeyInstance) {
      Homey = homeyInstance;
      readyFired = true;
      // Release the spinner before any other work, so a later failure still
      // leaves a usable page behind.
      Homey.ready();
      // Wrapped, not passed directly: boot() is declared in the body script,
      // which has not been parsed yet when homey.js fires this from the head.
      whenReady(function () { boot(); });
    }
  </script>
  <!-- Required on app settings pages: without it onHomeyReady never fires and
       Homey keeps showing its loading spinner forever. -->
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Lets the browser theme scrollbars and form controls, and re-styles the
         page correctly when the system switches theme while it is open. */
      color-scheme: light dark;

      --bg: #f5f6f8;
      --card: #ffffff;
      --ink: #1a202c;
      --muted: #5c636e;
      --line: #e4e7eb;
      --track: #e9edf1;
      /* --accent paints fills and borders, where its brightness is the point.
         As text it only reaches 3.3:1 on white, so type uses --accent-text. */
      --accent: #0095d5;
      --accent-text: #0075ad;
      --accent-btn: #0077b0;
      --accent-soft: #e6f6fd;
      --ok: #145f36;
      --warn: #7a4707;
      --alarm: #c22a1e;
      --alarm-soft: #fdf0ef;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --ink: #e8eaed;
        --muted: #adb4bf;
        --line: #2c3037;
        --track: #2c3037;
        --accent-text: #4cc2f2;
        --accent-soft: #10303e;
        --ok: #4ecb8a;
        --warn: #e8b04a;
        --alarm: #ff9b93;
        --alarm-soft: #3a1e1c;
        --shadow: none;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px 14px 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── tabs ─────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--track);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 8px 6px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .tab.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

    .panel { display: none; }
    .panel.active { display: block; animation: fade .18s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    /* ── cards ────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 15px 16px;
      margin-bottom: 12px;
    }
    .card-head { display: flex; align-items: center; gap: 10px; }
    .card-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 1px; word-break: break-word; }

    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--ok); flex: 0 0 auto;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent);
    }
    .dot.off { background: var(--alarm); box-shadow: 0 0 0 3px color-mix(in srgb, var(--alarm) 22%, transparent); }
    @supports not (color: color-mix(in srgb, red 50%, blue)) {
      .dot, .dot.off { box-shadow: none; }
    }

    /* ── stat grid ────────────────────────────────────────────────── */
    /* Flex, not grid: seven tiles never divide evenly into a row, so the last
       row is always short. Grid would leave it hanging at the left edge;
       flex-wrap with justify-content centres it under the row above. */
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }
    /* A button, not a div: these open a list, so they need keyboard focus and
       a real pressed state. */
    .stat {
      /* No grow, so every tile stays the same width whichever row it lands in.
         The basis fits the longest label in all three languages. */
      flex: 0 1 78px;
      background: var(--bg); border: 1px solid transparent; border-radius: 9px;
      padding: 9px 4px; text-align: center;
      font: inherit; color: inherit;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .stat:hover:not(:disabled) { border-color: var(--accent); }
    .stat[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .stat:disabled { cursor: default; opacity: .55; }
    .stat .v { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
    .stat .k { font-size: 10px; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: .04em; }
    .stat.bad .v { color: var(--alarm); }

    /* ── detail list ──────────────────────────────────────────────── */
    .detail { margin-top: 12px; border-top: 1px solid var(--line); }
    .item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: none; }
    .item .body { flex: 1; min-width: 0; }
    .item .name { font-size: 13px; font-weight: 600; word-break: break-word; }
    .item .meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; word-break: break-word; }
    .item .badge {
      flex: 0 0 auto; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .03em;
      padding: 3px 7px; border-radius: 6px;
      background: var(--track); color: var(--muted);
      white-space: nowrap;
    }
    .item .badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
    .item .badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
    .item .badge.alarm { background: var(--alarm-soft); color: var(--alarm); }
    @supports not (color: color-mix(in srgb, red 50%, blue)) {
      .item .badge.ok, .item .badge.warn { background: var(--track); }
    }
    .item .bar { height: 4px; border-radius: 2px; background: var(--track); margin-top: 5px; overflow: hidden; }
    .item .bar span { display: block; height: 100%; border-radius: 2px; background: var(--ok); }
    .item .bar span.warn { background: var(--warn); }
    .item .bar span.alarm { background: var(--alarm); }
    .detail .empty { padding: 18px 0; }

    /* ── buttons ──────────────────────────────────────────────────── */
    .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    button.act {
      flex: 1 1 96px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button.act:hover { border-color: var(--accent); color: var(--accent-text); }
    button.act.primary { background: var(--accent-btn); border-color: var(--accent-btn); color: #fff; }
    button.act.primary:hover { filter: brightness(1.08); color: #fff; }
    button.act:disabled { opacity: .5; cursor: default; }

    /* ── messages ─────────────────────────────────────────────────── */
    .msg {
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.5;
      margin-top: 12px;
      word-break: break-word;
    }
    .msg.err { background: var(--alarm-soft); color: var(--alarm); }
    .msg.info { background: var(--accent-soft); color: var(--accent-text); }

    .empty { color: var(--muted); text-align: center; padding: 34px 16px; font-size: 13px; }

    /* ── diagnostics ──────────────────────────────────────────────── */
    .check { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .check:last-child { border-bottom: none; }
    .check .mark { font-weight: 700; flex: 0 0 auto; width: 15px; text-align: center; }
    .check .mark.ok { color: var(--ok); }
    .check .mark.no { color: var(--alarm); }
    .check .body { min-width: 0; flex: 1; }
    .check .label { font-size: 13px; font-weight: 600; }
    .check .detail { font-size: 11.5px; color: var(--muted); word-break: break-word; }
    .check .ms { font-size: 11px; color: var(--muted); flex: 0 0 auto; }

    /* ── help ─────────────────────────────────────────────────────── */
    h2 { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
    h3 { font-size: 12.5px; font-weight: 700; margin: 16px 0 5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .card p { font-size: 13px; margin-bottom: 8px; }
    .card p:last-child { margin-bottom: 0; }
    ol, ul { margin: 0 0 4px 18px; font-size: 13px; }
    li { margin-bottom: 5px; }
    code {
      background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
      padding: 1px 5px; font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-word;
    }
    .kv { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
    .kv:last-child { border-bottom: none; }
    .kv .k { flex: 0 0 40%; font-weight: 600; }
    .kv .v { color: var(--muted); }

    /* ── toggle ───────────────────────────────────────────────────── */
    .opt { display: flex; align-items: flex-start; gap: 11px; }
    .opt input { margin-top: 2px; width: 17px; height: 17px; flex: 0 0 auto; accent-color: var(--accent); }
    .opt .label { font-size: 13px; font-weight: 600; }
    .opt .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── log ──────────────────────────────────────────────────────── */
    .log { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .log:last-child { border-bottom: none; }
    .log .meta { font-size: 10.5px; color: var(--muted); }
    .log .src { color: var(--accent-text); font-weight: 600; }
    .log.error .text { color: var(--alarm); }
    .log .text { word-break: break-word; }

    pre {
      background: #10131a; color: #d7dce3;
      border-radius: 9px; padding: 12px;
      font-size: 11px; line-height: 1.5;
      overflow: auto; max-height: 420px;
      white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    select {
      width: 100%; padding: 9px 10px;
      border: 1px solid var(--line); border-radius: 8px;
      font: inherit; font-size: 13px;
      background: var(--card); color: var(--ink);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab active" data-panel="p-systems" id="tab-systems">Systems</button>
    <button class="tab" data-panel="p-help" id="tab-help">Help</button>
    <button class="tab" data-panel="p-data" id="tab-data">Data</button>
    <button class="tab" data-panel="p-log" id="tab-log">Log</button>
  </div>

  <div class="panel active" id="p-systems">
    <div id="systems"><div class="empty">…</div></div>
  </div>

  <div class="panel" id="p-help">
    <div id="help"></div>
  </div>

  <div class="panel" id="p-data">
    <div class="card">
      <div class="card-title" id="l-data">Raw values</div>
      <div class="card-sub" id="h-data"></div>
    </div>
    <select id="data-select"></select>
    <div class="row" style="margin-top:0">
      <button class="act" id="btn-data-reload">Reload</button>
      <button class="act" id="btn-data-copy">Copy</button>
    </div>
    <pre id="data-out" style="margin-top:12px">–</pre>
  </div>

  <div class="panel" id="p-log">
    <div class="card">
      <div class="opt">
        <input type="checkbox" id="verbose">
        <div>
          <div class="label" id="l-verbose">Detailed logging</div>
          <div class="hint" id="h-verbose"></div>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:0">
      <button class="act" id="btn-log-reload">Reload</button>
      <button class="act" id="btn-log-copy">Copy</button>
      <button class="act" id="btn-log-clear">Clear</button>
    </div>
    <div class="card" style="margin-top:12px" id="log-out"><div class="empty">…</div></div>
  </div>

  <script type="text/javascript">
    var systems = [];
    var systemsError = null;
    // Homey renders this page in a browser view, so the user's locale arrives
    // as navigator.language. LANG indexes every [en, de, nl] entry below.
    var LANG = (function () {
      var code = (navigator.language || 'en').toLowerCase();
      if (code.indexOf('de') === 0) return 1;
      if (code.indexOf('nl') === 0) return 2;
      return 0;
    })();
    var HELP_LANG = ['en', 'de', 'nl'][LANG];

    var TEXT = {
      systems: ['Systems', 'Systeme', 'Systemen'],
      help: ['Help', 'Hilfe', 'Help'],
      data: ['Data', 'Daten', 'Gegevens'],
      log: ['Log', 'Protokoll', 'Logboek'],
      reload: ['Reload', 'Neu laden', 'Opnieuw laden'],
      copy: ['Copy', 'Kopieren', 'Kopiëren'],
      clear: ['Clear', 'Leeren', 'Wissen'],
      refresh: ['Refresh now', 'Jetzt aktualisieren', 'Nu vernieuwen'],
      diagnose: ['Run diagnostics', 'Diagnose starten', 'Diagnose starten'],
      diagnosing: ['Testing…', 'Teste…', 'Bezig met testen…'],
      none: [
        'No TrueNAS system paired yet. Add one under Devices.',
        'Noch kein TrueNAS-System verbunden. Füge unter Geräte eines hinzu.',
        'Nog geen TrueNAS-systeem gekoppeld. Voeg er een toe bij Apparaten.'
      ],
      noLog: [
        'No entries. Turn on detailed logging to record the poll cycle.',
        'Keine Einträge. Aktiviere die ausführliche Protokollierung, um den Abfragezyklus aufzuzeichnen.',
        'Geen items. Zet uitgebreide logging aan om de opvraagcyclus vast te leggen.'
      ],
      offline: ['Unreachable', 'Nicht erreichbar', 'Onbereikbaar'],
      online: ['Connected', 'Verbunden', 'Verbonden'],
      copied: ['Copied to clipboard.', 'In die Zwischenablage kopiert.', 'Gekopieerd naar het klembord.'],
      loadFailed: [
        'Could not load the systems. Switch back to the Systems tab for the reason.',
        'Die Systeme konnten nicht geladen werden. Der Grund steht im Reiter Systeme.',
        'De systemen konden niet worden geladen. De reden staat op het tabblad Systemen.'
      ],
      pools: ['Pools', 'Pools', 'Pools'],
      disks: ['Disks', 'Platten', 'Schijven'],
      services: ['Services', 'Dienste', 'Services'],
      apps: ['Apps', 'Apps', 'Apps'],
      vms: ['VMs', 'VMs', "VM's"],
      tasks: ['Tasks', 'Aufgaben', 'Taken'],
      alerts: ['Alerts', 'Meldungen', 'Meldingen'],
      allOk: ['All checks passed.', 'Alle Prüfungen bestanden.', 'Alle controles geslaagd.'],
      someFailed: [
        'check(s) failed. See the details above.',
        'Prüfung(en) fehlgeschlagen. Details oben.',
        'controle(s) mislukt. Zie de details hierboven.'
      ],
      verboseLabel: ['Detailed logging', 'Ausführliche Protokollierung', 'Uitgebreide logging'],
      verboseHint: [
        'Records every poll cycle, not just errors. Useful when reporting a problem — turn it off again afterwards.',
        'Zeichnet jeden Abfragezyklus auf, nicht nur Fehler. Hilfreich beim Melden eines Problems — danach wieder ausschalten.',
        'Legt elke opvraagcyclus vast, niet alleen fouten. Handig bij het melden van een probleem — zet het daarna weer uit.'
      ],
      loading: ['Loading…', 'Wird geladen…', 'Bezig met laden…'],
      noItems: ['Nothing here.', 'Nichts vorhanden.', 'Niets aanwezig.'],
      flag_boot: ['Boot pool', 'Boot-Pool', 'Boot-pool'],
      flag_autostart: ['Starts on boot', 'Startet beim Hochfahren', 'Start bij opstarten'],
      flag_update: ['Update available', 'Update verfügbar', 'Update beschikbaar'],
      flag_image: ['Image update', 'Image-Update', 'Image-update'],
      flag_disabled: ['Disabled', 'Deaktiviert', 'Uitgeschakeld'],
      flag_unassigned: ['Not in a pool', 'Keinem Pool zugewiesen', 'Niet in een pool'],
      dataLabel: ['Raw values', 'Rohwerte', 'Ruwe waarden'],
      dataHint: [
        'Exactly what the app read from the NAS, before any conversion. If a reading looks wrong, copy this into your report.',
        'Genau das, was die App vom NAS gelesen hat, vor jeder Umrechnung. Wirkt ein Wert falsch, kopiere dies in deine Meldung.',
        'Precies wat de app van de NAS heeft gelezen, vóór elke omrekening. Lijkt een waarde onjuist, kopieer dit dan in je melding.'
      ]
    };

    function t(key) {
      var e = TEXT[key];
      if (!e) return key;
      return e[LANG] !== undefined ? e[LANG] : e[0];
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined && text !== null) n.textContent = String(text);
      return n;
    }

    function api(method, path, body) {
      return new Promise(function (resolve, reject) {
        Homey.api(method, path, body || null, function (err, result) {
          if (err) reject(err);
          else resolve(result);
        });
      });
    }

    // ── boot ────────────────────────────────────────────────────────
    function boot() {
      try {
        setupUi();
      } catch (err) {
        document.getElementById('systems').innerHTML = '';
        document.getElementById('systems').appendChild(el('div', 'msg err', String(err.message || err)));
        return;
      }
      loadSystems();
      renderHelp();
      loadAppSettings();
    }

    setTimeout(function () {
      if (readyFired) return;
      var c = document.getElementById('systems');
      if (c) {
        c.innerHTML = '';
        c.appendChild(el('div', 'msg err',
          'Could not connect to Homey (homey.js did not load). Close and reopen the app settings.'));
      }
    }, 12000);

    function setupUi() {
      document.getElementById('tab-systems').textContent = t('systems');
      document.getElementById('tab-help').textContent = t('help');
      document.getElementById('tab-data').textContent = t('data');
      document.getElementById('tab-log').textContent = t('log');
      document.getElementById('btn-data-reload').textContent = t('reload');
      document.getElementById('btn-data-copy').textContent = t('copy');
      document.getElementById('btn-log-reload').textContent = t('reload');
      document.getElementById('btn-log-copy').textContent = t('copy');
      document.getElementById('btn-log-clear').textContent = t('clear');
      document.getElementById('l-verbose').textContent = t('verboseLabel');
      document.getElementById('h-verbose').textContent = t('verboseHint');
      document.getElementById('l-data').textContent = t('dataLabel');
      document.getElementById('h-data').textContent = t('dataHint');

      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
        tab.addEventListener('click', function () { showPanel(tab); });
      });

      document.getElementById('btn-data-reload').addEventListener('click', loadData);
      document.getElementById('btn-data-copy').addEventListener('click', function () {
        copy(document.getElementById('data-out').textContent);
      });
      document.getElementById('data-select').addEventListener('change', loadData);
      document.getElementById('btn-log-reload').addEventListener('click', loadLog);
      document.getElementById('btn-log-clear').addEventListener('click', clearLog);
      document.getElementById('btn-log-copy').addEventListener('click', copyLog);
      document.getElementById('verbose').addEventListener('change', saveAppSettings);
    }

    function showPanel(tab) {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.remove('active'); });
      Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.panel).classList.add('active');
      // Otherwise a tab opens mid-page, at whatever offset the previous one
      // was scrolled to.
      window.scrollTo(0, 0);
      if (tab.dataset.panel === 'p-data') loadData();
      if (tab.dataset.panel === 'p-log') loadLog();
    }

    // ── systems ─────────────────────────────────────────────────────
    function loadSystems() {
      api('GET', '/systems')
        .then(function (result) {
          systems = result || [];
          systemsError = null;
          renderSystems();
          renderDataOptions();
        })
        .catch(function (err) {
          systems = [];
          systemsError = String(err.message || err);
          renderDataOptions();
          var c = document.getElementById('systems');
          c.innerHTML = '';
          c.appendChild(el('div', 'msg err', systemsError));
        });
    }

    function renderSystems() {
      var c = document.getElementById('systems');
      c.innerHTML = '';

      if (!systems.length) {
        c.appendChild(el('div', 'empty', t('none')));
        return;
      }

      systems.forEach(function (sys) {
        var card = el('div', 'card');

        var head = el('div', 'card-head');
        head.appendChild(el('span', 'dot' + (sys.available ? '' : ' off')));
        var titles = el('span');
        titles.appendChild(el('div', 'card-title', sys.name));
        var sub = [sys.protocol + '://' + sys.host + ':' + sys.port];
        if (sys.version) sub.push(sys.version);
        if (sys.uptime) sub.push(sys.uptime);
        titles.appendChild(el('div', 'card-sub', sub.join('  ·  ')));
        head.appendChild(titles);
        card.appendChild(head);

        var detail = el('div');

        if (sys.available && sys.counts) {
          var grid = el('div', 'grid');
          var tiles = [];

          [['pools', sys.counts.pools], ['disks', sys.counts.disks], ['services', sys.counts.services],
            ['apps', sys.counts.apps], ['vms', sys.counts.vms], ['tasks', sys.counts.tasks],
            ['alerts', sys.counts.alerts]].forEach(function (pair) {
            var kind = pair[0];
            var count = pair[1];
            if (count === undefined || count === null) return;

            // Red only for a real problem: a NAS routinely files successful
            // backups as INFO alerts, and three of those are not an alarm.
            var severe = kind === 'alerts' && sys.counts.alertsSevere > 0;
            var s = el('button', 'stat' + (severe ? ' bad' : ''));
            s.type = 'button';
            s.appendChild(el('div', 'v', count));
            s.appendChild(el('div', 'k', t(kind)));
            s.setAttribute('aria-expanded', 'false');
            // Nothing to expand, so the tile stays a plain figure.
            if (!count) s.disabled = true;
            else s.addEventListener('click', function () { toggle(kind, s); });

            tiles.push(s);
            grid.appendChild(s);
          });

          card.appendChild(grid);
          card.appendChild(detail);

          var openKind = null;

          function toggle(kind, tile) {
            tiles.forEach(function (x) { x.setAttribute('aria-expanded', 'false'); });
            detail.innerHTML = '';

            if (openKind === kind) { openKind = null; return; }
            openKind = kind;
            tile.setAttribute('aria-expanded', 'true');

            var pending = el('div', 'detail');
            pending.appendChild(el('div', 'empty', t('loading')));
            detail.appendChild(pending);

            api('GET', '/details?systemId=' + encodeURIComponent(sys.systemId)
              + '&kind=' + encodeURIComponent(kind))
              .then(function (res) {
                // A second tap while this was in flight wins.
                if (openKind !== kind) return;
                detail.innerHTML = '';
                detail.appendChild(renderItems(res.items || []));
              })
              .catch(function (err) {
                if (openKind !== kind) return;
                detail.innerHTML = '';
                detail.appendChild(el('div', 'msg err', String(err.message || err)));
              });
          }
        } else if (sys.lastError) {
          card.appendChild(el('div', 'msg err', sys.lastError));
        }

        var row = el('div', 'row');
        var refresh = el('button', 'act', t('refresh'));
        var diag = el('button', 'act primary', t('diagnose'));
        row.appendChild(refresh);
        row.appendChild(diag);
        card.appendChild(row);

        var out = el('div');
        card.appendChild(out);

        refresh.addEventListener('click', function () {
          refresh.disabled = true;
          api('GET', '/refresh?systemId=' + encodeURIComponent(sys.systemId))
            .then(loadSystems)
            .catch(function (err) { showIn(out, 'err', err.message || String(err)); })
            .then(function () { refresh.disabled = false; });
        });

        diag.addEventListener('click', function () {
          diag.disabled = true;
          diag.textContent = t('diagnosing');
          out.innerHTML = '';
          api('GET', '/diagnostics?systemId=' + encodeURIComponent(sys.systemId))
            .then(function (res) { renderChecks(out, res); })
            .catch(function (err) { showIn(out, 'err', err.message || String(err)); })
            .then(function () {
              diag.disabled = false;
              diag.textContent = t('diagnose');
            });
        });

        c.appendChild(card);
      });
    }

    /**
     * One row per pool, disk, app… The subtitle arrives pre-composed from the
     * API because it is only numbers and units; the flag words are translated
     * here, and an unrecognised TrueNAS state is shown raw rather than hidden.
     */
    function renderItems(items) {
      var list = el('div', 'detail');

      if (!items.length) {
        list.appendChild(el('div', 'empty', t('noItems')));
        return list;
      }

      items.forEach(function (item) {
        var row = el('div', 'item');
        var body = el('div', 'body');
        body.appendChild(el('div', 'name', item.title));

        var meta = [];
        if (item.sub) meta.push(item.sub);
        if (item.note) meta.push(item.note);
        (item.flags || []).forEach(function (f) { meta.push(t('flag_' + f)); });
        if (meta.length) body.appendChild(el('div', 'meta', meta.join('  ·  ')));

        if (item.meter !== null && item.meter !== undefined) {
          var bar = el('div', 'bar');
          var fill = el('span', item.tone === 'alarm' ? 'alarm' : (item.meter >= 90 ? 'alarm' : (item.meter >= 75 ? 'warn' : '')));
          fill.style.width = Math.max(0, Math.min(100, item.meter)) + '%';
          bar.appendChild(fill);
          body.appendChild(bar);
        }

        row.appendChild(body);
        if (item.state) row.appendChild(el('span', 'badge ' + (item.tone || ''), stateLabel(item.state)));
        list.appendChild(row);
      });

      return list;
    }

    // TrueNAS reports states as uppercase machine values. The common ones get a
    // readable word; anything else is passed through so a new state is visible
    // rather than swallowed.
    var STATE_LABELS = {
      ONLINE: ['Online', 'Online', 'Online'],
      DEGRADED: ['Degraded', 'Fehler', 'Probleem'],
      FAULTED: ['Faulted', 'Ausgefallen', 'Defect'],
      OFFLINE: ['Offline', 'Offline', 'Offline'],
      UNAVAIL: ['Unavailable', 'Nicht verfügbar', 'Niet beschikbaar'],
      SCRUB: ['Scrub', 'Scrub', 'Scrub'],
      RUNNING: ['Running', 'Läuft', 'Draait'],
      STOPPED: ['Stopped', 'Gestoppt', 'Gestopt'],
      CRASHED: ['Crashed', 'Abgestürzt', 'Vastgelopen'],
      DEPLOYING: ['Deploying', 'Wird bereitgestellt', 'Wordt uitgerold'],
      PENDING: ['Pending', 'Ausstehend', 'In wachtrij'],
      SUCCESS: ['Success', 'Erfolgreich', 'Geslaagd'],
      FINISHED: ['Finished', 'Abgeschlossen', 'Klaar'],
      FAILED: ['Failed', 'Fehlgeschlagen', 'Mislukt'],
      ERROR: ['Error', 'Fehler', 'Fout'],
      ABORTED: ['Aborted', 'Abgebrochen', 'Afgebroken'],
      WARNING: ['Warning', 'Warnung', 'Waarschuwing'],
      CRITICAL: ['Critical', 'Kritisch', 'Kritiek'],
      INFO: ['Info', 'Info', 'Info'],
      NOTICE: ['Notice', 'Hinweis', 'Let op'],
      ALERT: ['Alert', 'Alarm', 'Alarm'],
      EMERGENCY: ['Emergency', 'Notfall', 'Noodgeval'],
      UNKNOWN: ['Unknown', 'Unbekannt', 'Onbekend']
    };

    function stateLabel(state) {
      var entry = STATE_LABELS[state];
      if (!entry) return state;
      return entry[LANG] !== undefined ? entry[LANG] : entry[0];
    }

    function showIn(container, kind, message) {
      container.innerHTML = '';
      container.appendChild(el('div', 'msg ' + kind, message));
    }

    function renderChecks(container, res) {
      container.innerHTML = '';
      var wrap = el('div');
      wrap.style.marginTop = '12px';

      (res.checks || []).forEach(function (c) {
        var row = el('div', 'check');
        row.appendChild(el('span', 'mark ' + (c.ok ? 'ok' : 'no'), c.ok ? '✓' : '✕'));
        var body = el('div', 'body');
        body.appendChild(el('div', 'label', c.label));
        if (c.detail) body.appendChild(el('div', 'detail', c.detail));
        row.appendChild(body);
        row.appendChild(el('span', 'ms', c.ms + ' ms'));
        wrap.appendChild(row);
      });

      container.appendChild(wrap);
      container.appendChild(el('div', 'msg ' + (res.failed ? 'err' : 'info'),
        res.failed ? res.failed + ' ' + t('someFailed') : t('allOk')));
    }

    // ── help ────────────────────────────────────────────────────────
    function renderHelp() {
      var c = document.getElementById('help');
      c.innerHTML = '';
      HELP[HELP_LANG].forEach(function (section) {
        var card = el('div', 'card');
        card.appendChild(el('h2', null, section.title));
        section.blocks.forEach(function (b) {
          if (b.p) card.appendChild(el('p', null, b.p));
          if (b.h) card.appendChild(el('h3', null, b.h));
          if (b.ol || b.ul) {
            var list = el(b.ol ? 'ol' : 'ul');
            (b.ol || b.ul).forEach(function (item) {
              var li = el('li');
              li.innerHTML = item;
              list.appendChild(li);
            });
            card.appendChild(list);
          }
          if (b.kv) {
            b.kv.forEach(function (pair) {
              var row = el('div', 'kv');
              row.appendChild(el('span', 'k', pair[0]));
              row.appendChild(el('span', 'v', pair[1]));
              card.appendChild(row);
            });
          }
        });
        c.appendChild(card);
      });
    }

    // ── data ────────────────────────────────────────────────────────
    function renderDataOptions() {
      var sel = document.getElementById('data-select');
      sel.innerHTML = '';
      systems.forEach(function (sys) {
        var o = document.createElement('option');
        o.value = sys.systemId;
        o.textContent = sys.name;
        sel.appendChild(o);
      });
    }

    function loadData() {
      var id = document.getElementById('data-select').value;
      if (!id) {
        document.getElementById('data-out').textContent = systemsError ? t('loadFailed') : t('none');
        return;
      }
      api('GET', '/debug?systemId=' + encodeURIComponent(id))
        .then(function (d) { document.getElementById('data-out').textContent = JSON.stringify(d, null, 2); })
        .catch(function (err) { document.getElementById('data-out').textContent = String(err.message || err); });
    }

    // ── log ─────────────────────────────────────────────────────────
    function loadLog() {
      api('GET', '/log')
        .then(function (entries) {
          var c = document.getElementById('log-out');
          c.innerHTML = '';
          if (!entries || !entries.length) { c.appendChild(el('div', 'empty', t('noLog'))); return; }
          entries.forEach(function (e) {
            var row = el('div', 'log' + (e.level === 'error' ? ' error' : ''));
            var meta = el('div', 'meta');
            meta.appendChild(el('span', null, e.time.replace('T', ' ').slice(0, 19) + '  '));
            meta.appendChild(el('span', 'src', e.source));
            row.appendChild(meta);
            row.appendChild(el('div', 'text', e.message));
            c.appendChild(row);
          });
        })
        .catch(function (err) {
          var c = document.getElementById('log-out');
          c.innerHTML = '';
          c.appendChild(el('div', 'msg err', String(err.message || err)));
        });
    }

    function clearLog() {
      api('POST', '/log/clear', {}).then(loadLog).catch(function () {});
    }

    function copyLog() {
      api('GET', '/log').then(function (entries) {
        copy((entries || []).map(function (e) {
          return e.time + ' [' + e.level + '] ' + e.source + ': ' + e.message;
        }).join('\n'));
      }).catch(function () {});
    }

    // ── app settings ────────────────────────────────────────────────
    function loadAppSettings() {
      api('GET', '/settings')
        .then(function (s) { document.getElementById('verbose').checked = !!(s && s.verbose_log); })
        .catch(function () {});
    }

    function saveAppSettings() {
      api('POST', '/settings', { verbose_log: document.getElementById('verbose').checked })
        .then(loadLog)
        .catch(function () {});
    }

    // ── clipboard ───────────────────────────────────────────────────
    function copy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { Homey.alert(t('copied')); });
        return;
      }
      var a = document.createElement('textarea');
      a.value = text;
      document.body.appendChild(a);
      a.select();
      try { document.execCommand('copy'); Homey.alert(t('copied')); } catch (e) { /* ignore */ }
      document.body.removeChild(a);
    }
